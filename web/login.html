<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1A1714">
<title>San Giorgio — Connexion</title>
<link rel="stylesheet" href="/web/app.css">
<style>
  .login-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 28px 22px; }
  .brand { text-align: center; margin-bottom: 34px; }
  .brand .name { font-size: 32px; font-weight: 800; letter-spacing: 4px; color: var(--gold); }
  .brand .sub { font-size: 12px; letter-spacing: 2px; color: var(--text2); margin-top: 6px; }
  .card { background: var(--bg2); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
  .card h2 { font-size: 15px; color: var(--text2); margin-bottom: 18px; font-weight: 600; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="brand">
    <div class="name">SAN GIORGIO</div>
    <div class="sub">PIZZERIA · RESTAURANT</div>
  </div>
  <div class="card">
    <h2>Connexion</h2>
    <div class="field">
      <label>Identifiant</label>
      <input id="username" type="text" autocomplete="username" placeholder="ex : marie" autocapitalize="none">
    </div>
    <div class="field">
      <label>Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••">
    </div>
    <button class="btn btn-wine" id="btn-login" onclick="doLogin()">Se connecter</button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script src="/web/app.js"></script>
<script>
  // Déjà connecté → menu
  if (SG.token() && SG.user()) location.href = '/web/menu.html';

  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn-login');

  document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    msg.className = 'msg';
    if (!username || !password) { msg.textContent = 'Renseigne identifiant et mot de passe.'; msg.className = 'msg err'; return; }
    btn.disabled = true; btn.textContent = 'Connexion…';
    try {
      const res = await fetch('/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      if (!res.ok) {
        const e = await res.json().catch(() => ({}));
        msg.textContent = e.detail || 'Connexion refusée.'; msg.className = 'msg err';
        btn.disabled = false; btn.textContent = 'Se connecter';
        return;
      }
      const data = await res.json();
      SG.setAuth(data.access_token, data.user);
      location.href = '/web/menu.html';
    } catch (e) {
      msg.textContent = 'Serveur injoignable.'; msg.className = 'msg err';
      btn.disabled = false; btn.textContent = 'Se connecter';
    }
  }
</script>
</body>
</html>
